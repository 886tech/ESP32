name: Build grblHAL ESP32 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码（包含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 配置ESP-IDF v4.3编译环境
        uses: espressif/setup-espressif-esp-idf@v1
        with:
          version: release/v4.3

      - name: 编译固件
        run: idf.py build

      - name: 打包输出固件文件
        uses: actions/upload-artifact@v4
        with:
          name: esp32-grblhal-lathe-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/*.bin
