name: Build grblHAL ESP32 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码（包含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 自动开启车床+刀具表全套功能
        run: |
          sed -i 's/#define N_TOOLS.*/#define N_TOOLS 16/' main/grbl/config.h
          sed -i 's/#define TOOL_RADIUS_COMPENSATION.*/#define TOOL_RADIUS_COMPENSATION 1/' main/grbl/config.h
          sed -i 's/#define G43_SUPPORT.*/#define G43_SUPPORT 1/' main/grbl/config.h
          sed -i 's/#define G71_SUPPORT.*/#define G71_SUPPORT 1/' main/grbl/config.h
          sed -i 's/#define G76_SUPPORT.*/#define G76_SUPPORT 1/' main/grbl/config.h
          sed -i 's/#define G96_SUPPORT.*/#define G96_SUPPORT 1/' main/grbl/config.h

      - name: 编译固件（官方ESP-IDF v4.3环境）
        uses: docker://espressif/idf:release-v4.3
        with:
          args: idf.py build

      - name: 打包输出固件文件
        uses: actions/upload-artifact@v4
        with:
          name: esp32-grblhal-lathe-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/firmware.bin
